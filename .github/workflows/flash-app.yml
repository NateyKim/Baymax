name: Orange Pi flash desktop app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'devops/opi4-flash/**'
      - '.github/workflows/flash-app.yml'
  push:
    branches: [main]
    paths:
      - 'devops/opi4-flash/**'
      - '.github/workflows/flash-app.yml'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15
            name: macOS-Apple-Silicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install 'pyinstaller>=6.10,<7'
      - name: Package app
        run: python devops/opi4-flash/package_app.py
      - name: Zip Mac app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent devops/opi4-flash/dist/Ember-Image-Builder.app devops/opi4-flash/dist/Ember-Image-Builder-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Ember-Image-Builder-${{ matrix.name }}
          path: devops/opi4-flash/dist/Ember-Image-Builder.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Ember-Image-Builder-${{ matrix.name }}
          path: devops/opi4-flash/dist/Ember-Image-Builder-macOS.zip
